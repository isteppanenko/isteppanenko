<g class="neon" filter="url(#neon)">
  <text x="730" y="118" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="38" font-weight="700" fill="none" stroke="#ff79c6" stroke-width="2">&lt;/&gt;</text>
</g>

<!-- screen glow -->
<ellipse class="glow" cx="510" cy="175" rx="230" ry="140" fill="url(#screenGlow)"/>

<!-- monitor -->
<rect x="497" y="268" width="26" height="26" fill="#1a1b2b"/>
<rect x="466" y="292" width="88" height="8" rx="4" fill="#23243a"/>
<rect x="362" y="70" width="296" height="200" rx="10" fill="#0b0c14" stroke="#2f3150" stroke-width="2"/>
<rect x="370" y="78" width="280" height="184" rx="3" fill="#0d1117"/>
<rect x="370" y="78" width="280" height="16" rx="3" fill="#161b22"/>
<circle cx="380" cy="86" r="3" fill="#ff5f56"/><circle cx="390" cy="86" r="3" fill="#ffbd2e"/><circle cx="400" cy="86" r="3" fill="#27c93f"/>
<rect x="412" y="80" width="46" height="14" rx="2" fill="#0d1117"/>
<text class="ui" x="420" y="90">dev.js</text>
<g class="code">
  <text class="ln" x="386" y="114" text-anchor="end">1</text><text class="ln" x="386" y="129" text-anchor="end">2</text><text class="ln" x="386" y="144" text-anchor="end">3</text><text class="ln" x="386" y="159" text-anchor="end">4</text><text class="ln" x="386" y="174" text-anchor="end">5</text><text class="ln" x="386" y="189" text-anchor="end">6</text><text class="ln" x="386" y="204" text-anchor="end">7</text><text class="ln" x="386" y="219" text-anchor="end">8</text>
  <g>
    <animate attributeName="opacity" dur="16.645s" repeatCount="indefinite" keyTimes="0;0.9459;0.976;1" values="1;1;0;0"/>
    
      <clipPath id="l0"><rect x="394" y="103" height="15" width="0">
        <animate attributeName="width" dur="16.645s" repeatCount="indefinite" keyTimes="0;0.036;0.079;1" values="0;0;78;78"/>
      </rect></clipPath>
      <text xml:space="preserve" x="394" y="114" textLength="78" lengthAdjust="spacingAndGlyphs" clip-path="url(#l0)"><tspan class="k">const </tspan><tspan class="v">dev</tspan><tspan class="p"> = {</tspan></text>
      <clipPath id="l1"><rect x="394" y="118" height="15" width="0">
        <animate attributeName="width" dur="16.645s" repeatCount="indefinite" keyTimes="0;0.0958;0.1454;1" values="0;0;90;90"/>
      </rect></clipPath>
      <text xml:space="preserve" x="394" y="129" textLength="90" lengthAdjust="spacingAndGlyphs" clip-path="url(#l1)"><tspan class="p">  </tspan><tspan class="a">name</tspan><tspan class="p">: </tspan><tspan class="s">"Ihor"</tspan><tspan class="p">,</tspan></text>
      <clipPath id="l2"><rect x="394" y="133" height="15" width="0">
        <animate attributeName="width" dur="16.645s" repeatCount="indefinite" keyTimes="0;0.1622;0.2911;1" values="0;0;234;234"/>
      </rect></clipPath>
      <text xml:space="preserve" x="394" y="144" textLength="234" lengthAdjust="spacingAndGlyphs" clip-path="url(#l2)"><tspan class="p">  </tspan><tspan class="a">base</tspan><tspan class="p">: [</tspan><tspan class="s">"HTML"</tspan><tspan class="p">, </tspan><tspan class="s">"CSS"</tspan><tspan class="p">, </tspan><tspan class="s">"JS"</tspan><tspan class="p">, </tspan><tspan class="s">"React"</tspan><tspan class="p">],</tspan></text>
      <clipPath id="l3"><rect x="394" y="148" height="15" width="0">
        <animate attributeName="width" dur="16.645s" repeatCount="indefinite" keyTimes="0;0.3079;0.3641;1" values="0;0;102;102"/>
      </rect></clipPath>
      <text xml:space="preserve" x="394" y="159" textLength="102" lengthAdjust="spacingAndGlyphs" clip-path="url(#l3)"><tspan class="p">  </tspan><tspan class="a">school</tspan><tspan class="p">: </tspan><tspan class="s">"GoIT"</tspan><tspan class="p">,</tspan></text>
      <clipPath id="l4"><rect x="394" y="163" height="15" width="0">
        <animate attributeName="width" dur="16.645s" repeatCount="indefinite" keyTimes="0;0.3809;0.4668;1" values="0;0;156;156"/>
      </rect></clipPath>
      <text xml:space="preserve" x="394" y="174" textLength="156" lengthAdjust="spacingAndGlyphs" clip-path="url(#l4)"><tspan class="p">  </tspan><tspan class="a">now</tspan><tspan class="p">: </tspan><tspan class="s">"vibe coding + AI"</tspan><tspan class="p">,</tspan></text>
      <clipPath id="l5"><rect x="394" y="178" height="15" width="0">
        <animate attributeName="width" dur="16.645s" repeatCount="indefinite" keyTimes="0;0.4836;0.4902;1" values="0;0;12;12"/>
      </rect></clipPath>
      <text xml:space="preserve" x="394" y="189" textLength="12" lengthAdjust="spacingAndGlyphs" clip-path="url(#l5)"><tspan class="p">};</tspan></text>
      <clipPath id="l7"><rect x="394" y="208" height="15" width="0">
        <animate attributeName="width" dur="16.645s" repeatCount="indefinite" keyTimes="0;0.5164;0.6221;1" values="0;0;192;192"/>
      </rect></clipPath>
      <text xml:space="preserve" x="394" y="219" textLength="192" lengthAdjust="spacingAndGlyphs" clip-path="url(#l7)"><tspan class="v">dev</tspan><tspan class="p">.</tspan><tspan class="f">build</tspan><tspan class="p">();  </tspan><tspan class="c">// faster, with AI</tspan></text>
    <rect x="370" y="232" width="280" height="30" fill="#161b22"/>
    <text class="ui" x="378" y="241" font-size="7">TERMINAL</text>
    <clipPath id="tc"><rect x="380" y="238" height="15" width="0">
      <animate attributeName="width" dur="16.645s" repeatCount="indefinite" keyTimes="0;0.657;0.7116;1" values="0;0;78;78"/>
    </rect></clipPath>
    <text class="term" x="380" y="249" textLength="78" lengthAdjust="spacingAndGlyphs" clip-path="url(#tc)">$ npm run dev</text>
    <text class="ok" x="472" y="249" opacity="0">✓ ready<animate attributeName="opacity" dur="16.645s" repeatCount="indefinite" keyTimes="0;0.7537;0.7627;1" values="0;0;1;1"/></text>
    <g class="cur"><rect width="1.6" height="11" fill="#e6edf3">
      <animate attributeName="x" dur="16.645s" repeatCount="indefinite" keyTimes="0;0.036;0.036;0.079;0.0958;0.0958;0.1454;0.1622;0.1622;0.2911;0.3079;0.3079;0.3641;0.3809;0.3809;0.4668;0.4836;0.4836;0.4902;0.5071;0.5071;0.5104;0.5164;0.5164;0.6221;0.657;0.657;0.7116;1;1" values="394;394;394;472;472;394;484;484;394;628;628;394;496;496;394;550;550;394;406;406;394;394;394;394;586;586;380;458;458;394"/>
      <animate attributeName="y" dur="16.645s" repeatCount="indefinite" keyTimes="0;0.036;0.036;0.079;0.0958;0.0958;0.1454;0.1622;0.1622;0.2911;0.3079;0.3079;0.3641;0.3809;0.3809;0.4668;0.4836;0.4836;0.4902;0.5071;0.5071;0.5104;0.5164;0.5164;0.6221;0.657;0.657;0.7116;1;1" values="105;105;105;105;105;120;120;120;135;135;135;150;150;150;165;165;165;180;180;180;195;195;195;210;210;210;240;240;240;105"/>
    </rect></g>
  </g>
</g>

